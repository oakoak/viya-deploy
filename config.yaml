  - name: vi_alert_disposition
    code: |-
      OPTIONS mprint mprintnest mlogic mlogicnest symbolgen source source2 fullstimer msglevel=I;
      %m_log_start(stp, VI, alert_disposition);

      * Reference the uploaded JSON data;
      filename indata filesrvc "&_WEBIN_FILEURI";
      * Use the JSON engine to provide read-only sequential access to JSON data;
      libname indata json;
      title 'ALLDATA Table from JSON Input';
      proc print data=indata.alldata; run; quit;
      title 'ROOT Table from JSON Input';
      proc print data=indata.root; run; quit;

      data _null_;
       rc=jsonpp('indata','log');
      run;

      %m_log_end;
    parameters:
    - name: _action
      type: CHARACTER
      defaultValue: form,prompts,execute
      required: false
  - name: vi_alert_disposition_ewld_list_whl
    code: |2-

      %m_log_start(stp, VI, vi_alert_disposition_ewld_list_whl);

      * Reference the uploaded JSON data;
      filename indata filesrvc "&_WEBIN_FILEURI";

      data _null_;
       rc=jsonpp('indata','log');
      run;


          %let expire_date=;

      	data _null_; 
      		infile indata truncover scanover; 
      		input 
      			@'"actionableEntityId":"' id $255.;
      		id = substr(id,1,index(id,'",')-1); 
      	  	call symputx("partyNumber", id);
      	run;  

      	data _null_; 
      		infile indata truncover scanover; 
      		input 			@'"modifiedBy":"' userId $255. ;
      		userId =  substr(userId,1,index(userId,'",')-1); 
      	  	call symputx("userId", userId);
      	run; 


      	data _null_; 
      		infile indata truncover scanover; 
      		input 			@'"expire_date":"' expire_date $255. ;
      		userId =  substr(expire_date,1,index(expire_date,'",')-1); 
      	  	call symputx("expire_date", userId);
      	run;  


      	%put &partyNumber.;
      	%put &userId.;

      %put &expire_date.;


      	%if ("%superQ(expire_date)" ne "") %then %do;
      		%m_upd_ewld_whl(mvPartyNumber=&partyNumber.,mvScenId=Сверка клиентов с списками,mvExpDate=&expire_date.);
      	%end;

      %m_log_end;
