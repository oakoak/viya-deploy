  - name: update_result_list_alert
    code: |-
      	proc sql ;
      		connect using vi_alert as postgres;
      execute by postgres (
      DROP TABLE IF EXISTS svi_alerts.tmp_result_alert_lists;
      create table svi_alerts.tmp_result_alert_lists as (
      select 
      	scenario_fired_entity_id,
      	result_resolution_cd,
      	result_dttm,
      	case 
      		when result_dttm = current_productive_dttm then current_productive_user_id
      		else lstupdt_user_id
      	end result_user_id
      from (
      select 
      	tae.alerting_event_sk,
      	tae.alerting_event_id,
      	tae.actionable_entity_id,
      	tae.alert_id,
      	tae.alert_version_nbr_val,
      	close_action.disposition_resolution_cd,
      	close_action.action_dttm,
      	close_action.lstupdt_user_id,
      	tsfe.current_disp_resolution_cd,
      	tsfe.scenario_fired_entity_id,
      	tsfe.current_productive_dttm,
      	tsfe.current_productive_user_id,
      	case 
      		when disposition_resolution_cd = 'PRODUCTIVE' then coalesce(current_disp_resolution_cd, disposition_resolution_cd) 
      		when disposition_resolution_cd = 'NON_PRODUCTIVE' then 'NON_PRODUCTIVE'
      	end result_resolution_cd,
      	case 
      		when disposition_resolution_cd = 'PRODUCTIVE' then greatest(action_dttm, current_productive_dttm)
      		when disposition_resolution_cd = 'NON_PRODUCTIVE' then action_dttm
      	end result_dttm
      from svi_alerts.tdc_alerting_event tae 
      join (
      select alert_id, alert_version_nbr_val, disposition_resolution_cd, lstupdt_user_id,  action_dttm from (
      select alert_id, alert_version_nbr_val, disposition_resolution_cd ,lstupdt_user_id,  action_dttm, row_number() over (partition by alert_id, alert_version_nbr_val order by action_dttm desc ) as rn from svi_alerts.tdc_alert_action taa 
      where taa.action_type_cd = 'DISPOSITION_INVOKED'
      ) a
      where rn = 1
      ) close_action on  tae.alert_id = close_action.alert_id and tae.alert_version_nbr_val = close_action.alert_version_nbr_val
      join svi_alerts.tdc_scenario_fired_event tsfe on tsfe.alerting_event_id = tae.alerting_event_id
      where tae.domain_id = 'nbu_list_domain'
      ) a
      )
      );
            disconnect from postgres;
      	quit;

      	proc sql ;
      DROP TABLE sas_aml.tmp_result_alert_lists;
      create table sas_aml.tmp_result_alert_lists as select * from vi_alert.tmp_result_alert_lists;
      	quit;



      	proc sql;
      	   connect using sas_aml as oracle;

      		execute by oracle (
      MERGE INTO amlprep.OFFLINE_PARTY_EWLD_V5 t
      USING sas_aml.tmp_result_alert_lists s
        ON (t.OFFLINE_PARTY_EWLD_KEY = s.scenario_fired_entity_id)
      WHEN MATCHED THEN
        UPDATE SET
          t.result_resolution_cd = s.result_resolution_cd,
          t.result_dttm = s.result_dttm,
          t.result_user_id = s.result_user_id,
          t.PROCESSED_DTTM = sysdate
      );
      	   disconnect from oracle;
      	quit;
    parameters:
    - name: _action
      type: CHARACTER
      defaultValue: form,prompts,execute
      required: false
