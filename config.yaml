  - name: sp_get_risks
    code: |
      /* 1. Настройка параметров и значений по умолчанию */
      %let page = %sysfunc(ifc(%symexist(page), &page, 1));
      %let limit = %sysfunc(ifc(%symexist(limit), &limit, 10));
      %let sort_by = %sysfunc(ifc(%symexist(sort_by), &sort_by, last_updated_at_dttm));
      %let sort_order = %sysfunc(ifc(%symexist(sort_order), &sort_order, desc));
      %let filter_city = %sysfunc(ifc(%symexist(filter_city), &filter_city, %str()));

      %let offset = %eval((&page - 1) * &limit);

      	proc sql noprint;
      		connect using vi_alert as postgres;
      create table local_copy as
          select * from connection to postgres (
        SELECT * FROM fdhdata.v_fsc_internal_risk_dim_h
          order by &sort_by. &sort_order.
          LIMIT &limit. OFFSET &offset.;
      );
            disconnect from postgres;
      quit;

      proc json out=_webout pretty;
          export local_copy  / nosastags;;
      run;
    parameters:
    - name: _action
      type: CHARACTER
      defaultValue: execute
      required: false
    - name: _output_type
      type: CHARACTER
      defaultValue: HTML
      required: false
    - name: page
      type: NUMERIC
      required: false
    - name: limit
      type: NUMERIC
      required: false
    - name: sort_by
      type: CHARACTER
      defaultValue: last_updated_at_dttm
      required: false
    - name: sort_order
      type: CHARACTER
      defaultValue: desc
      required: false
